<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduVision — Entry Animation Video Player (MP4)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #060608;
    color: #f0ede8;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
  }
  .header-box {
    text-align: center;
    margin-bottom: 24px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(232, 180, 42, 0.12);
    border: 1px solid rgba(232, 180, 42, 0.35);
    color: #e8b42a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 6px 20px;
    border-radius: 999px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .badge::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e8b42a;
    box-shadow: 0 0 10px #e8b42a;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(24px, 3.5vw, 36px);
    font-weight: 800;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #fff2cc 0%, #e8b42a 60%, #b88218 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    color: #8c8983;
    font-size: 15px;
    margin-top: 6px;
  }
  .video-container {
    width: 100%;
    max-width: 1060px;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(232, 180, 42, 0.4);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 45px rgba(232, 180, 42, 0.25);
    position: relative;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .controls-bar {
    margin-top: 24px;
    display: flex;
    gap: 14px;
    align-items: center;
    background: rgba(14, 14, 18, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 10px 24px;
    border-radius: 999px;
  }
  .btn {
    background: linear-gradient(135deg, #c9932a, #e8b42a);
    color: #070709;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .btn:hover {
    box-shadow: 0 4px 18px rgba(232, 180, 42, 0.5);
    transform: translateY(-1px);
  }
  .btn-sec {
    background: rgba(255, 255, 255, 0.08);
    color: #f0ede8;
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 999px;
    cursor: pointer;
  }
  .btn-sec:hover {
    background: rgba(255, 255, 255, 0.15);
  }
</style>
</head>
<body>

<div class="header-box">
  <div class="badge">Official MP4 Video Preview</div>
  <h1>EduVision Pure Kinetic Intro (No Logo in Intro)</h1>
  <p>E-Typing ➔ Glides UP ➔ Miss Ishika Sharma Inspiration ➔ Opens to Website with Logo in Corner</p>
</div>

<div class="video-container">
  <video id="evVideo" src="eduvision_site_only_logo.mp4" autoplay loop muted playsinline controls></video>
</div>

<div class="controls-bar">
  <button class="btn" onclick="replayVideo()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Replay Video
  </button>
  <button class="btn-sec" onclick="togglePlayPause()" id="playPauseBtn">Pause</button>
  <button class="btn-sec" onclick="openFullscreen()">⛶ Fullscreen</button>
</div>

<script>
  const video = document.getElementById('evVideo');
  const playBtn = document.getElementById('playPauseBtn');

  function replayVideo() {
    video.currentTime = 0;
    video.play();
    playBtn.innerText = 'Pause';
  }

  function togglePlayPause() {
    if (video.paused) {
      video.play();
      playBtn.innerText = 'Pause';
    } else {
      video.pause();
      playBtn.innerText = 'Play';
    }
  }

  function openFullscreen() {
    if (video.requestFullscreen) {
      video.requestFullscreen();
    }
  }
</script>

</body>
</html>
