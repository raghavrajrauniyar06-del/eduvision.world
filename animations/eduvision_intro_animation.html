<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Official Apple "Eduvision" — 1:1 Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ═══ MASTER STAGE ═══ */
  #macStage {
    position: fixed;
    inset: 0;
    z-index: 100000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 1.3s cubic-bezier(0.16, 1, 0.3, 1), transform 1.3s cubic-bezier(0.16, 1, 0.3, 1), filter 1.3s ease;
  }

  #macStage.dissolve {
    opacity: 0;
    transform: scale(1.06);
    filter: blur(14px);
    pointer-events: none;
  }

  /* Exact Apple Sonoma Blurred Landscape Wallpaper (1:1 Match) */
  .wallpaper-bg {
    position: absolute;
    inset: -40px;
    background: 
      radial-gradient(ellipse 70% 55% at 50% 28%, #3e526a 0%, #1e2938 42%, #0e141c 78%),
      radial-gradient(circle at 22% 42%, rgba(217, 145, 20, 0.42) 0%, transparent 52%),
      radial-gradient(circle at 78% 44%, rgba(180, 83, 9, 0.38) 0%, transparent 54%),
      radial-gradient(ellipse 90% 45% at 50% 88%, #05080c 0%, #000000 100%);
    filter: blur(36px);
    transform: scale(1.05);
  }

  /* ═══ SVG VECTOR STAGE ═══ */
  .vector-stage {
    position: relative;
    z-index: 5;
    width: 90vw;
    max-width: 1160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vector-stage svg {
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 4px 28px rgba(0, 0, 0, 0.55));
  }

  /* ═══ PURE GPU FLUID LETTER-WRITING MOTION ═══ */

  #p0 {
    stroke-dasharray: 1770;
    stroke-dashoffset: 1770;
    animation: drawPath_0 0.48s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 0.45s;
  }
  @keyframes drawPath_0 {
    to { stroke-dashoffset: 0; }
  }

  #p1 {
    stroke-dasharray: 1540;
    stroke-dashoffset: 1540;
    animation: drawPath_1 0.38s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 0.87s;
  }
  @keyframes drawPath_1 {
    to { stroke-dashoffset: 0; }
  }

  #p2 {
    stroke-dasharray: 1300;
    stroke-dashoffset: 1300;
    animation: drawPath_2 0.32s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 1.21s;
  }
  @keyframes drawPath_2 {
    to { stroke-dashoffset: 0; }
  }

  #p3 {
    stroke-dasharray: 940;
    stroke-dashoffset: 940;
    animation: drawPath_3 0.24s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 1.49s;
  }
  @keyframes drawPath_3 {
    to { stroke-dashoffset: 0; }
  }

  #p4 {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawPath_4 0.24s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 1.70s;
  }
  @keyframes drawPath_4 {
    to { stroke-dashoffset: 0; }
  }

  #p5 {
    stroke-dasharray: 1135;
    stroke-dashoffset: 1135;
    animation: drawPath_5 0.28s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 1.91s;
  }
  @keyframes drawPath_5 {
    to { stroke-dashoffset: 0; }
  }

  #p6 {
    stroke-dasharray: 790;
    stroke-dashoffset: 790;
    animation: drawPath_6 0.20s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 2.16s;
  }
  @keyframes drawPath_6 {
    to { stroke-dashoffset: 0; }
  }

  #p7 {
    opacity: 0;
    transform-origin: center;
    animation: popDot 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 2.33s;
  }

  #p8 {
    stroke-dasharray: 240;
    stroke-dashoffset: 240;
    animation: drawPath_8 0.08s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 2.33s;
  }
  @keyframes drawPath_8 {
    to { stroke-dashoffset: 0; }
  }

  #p9 {
    stroke-dasharray: 735;
    stroke-dashoffset: 735;
    animation: drawPath_9 0.20s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 2.40s;
  }
  @keyframes drawPath_9 {
    to { stroke-dashoffset: 0; }
  }

  #p10 {
    stroke-dasharray: 725;
    stroke-dashoffset: 725;
    animation: drawPath_10 0.18s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 2.58s;
  }
  @keyframes drawPath_10 {
    to { stroke-dashoffset: 0; }
  }

  #p11 {
    stroke-dasharray: 790;
    stroke-dashoffset: 790;
    animation: drawPath_11 0.20s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 2.74s;
  }
  @keyframes drawPath_11 {
    to { stroke-dashoffset: 0; }
  }

  #p12 {
    opacity: 0;
    transform-origin: center;
    animation: popDot 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 2.91s;
  }

  #p13 {
    stroke-dasharray: 1825;
    stroke-dashoffset: 1825;
    animation: drawPath_13 0.38s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 2.91s;
  }
  @keyframes drawPath_13 {
    to { stroke-dashoffset: 0; }
  }

  #p14 {
    stroke-dasharray: 390;
    stroke-dashoffset: 390;
    animation: drawPath_14 0.12s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 3.25s;
  }
  @keyframes drawPath_14 {
    to { stroke-dashoffset: 0; }
  }

  #p15 {
    stroke-dasharray: 1115;
    stroke-dashoffset: 1115;
    animation: drawPath_15 0.32s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 3.35s;
  }
  @keyframes drawPath_15 {
    to { stroke-dashoffset: 0; }
  }

  @keyframes popDot {
    0% { opacity: 0; transform: scale(0.3); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ═══ APPLE ARROW BUTTON ("Get Started") ═══ */
  .apple-arrow-btn {
    position: absolute;
    bottom: 58px;
    z-index: 20;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid rgba(255, 255, 255, 0.28);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    cursor: pointer;
    opacity: 0;
    transform: translateY(16px);
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    animation: btnFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 3.4s;
  }

  .apple-arrow-btn:hover {
    background: rgba(0, 113, 227, 0.85);
    border-color: rgba(255, 255, 255, 0.45);
    transform: scale(1.08) translateY(0);
    box-shadow: 0 12px 36px rgba(0, 113, 227, 0.45);
  }

  .apple-arrow-btn svg {
    width: 18px;
    height: 18px;
    stroke: #ffffff;
    stroke-width: 2.4;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @keyframes btnFadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Floating Apple Control Bar */
  .control-bar {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 100001;
    display: flex;
    gap: 12px;
    align-items: center;
    background: rgba(20, 20, 25, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 8px 16px;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .ctrl-btn {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .ctrl-btn:hover {
    background: rgba(255, 255, 255, 0.25);
  }

  .loop-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #ddd;
    font-weight: 500;
    cursor: pointer;
  }

  .loop-toggle input {
    cursor: pointer;
    accent-color: #0071e3;
    width: 16px;
    height: 16px;
  }
</style>
</head>
<body>

<div class="control-bar">
  <button class="ctrl-btn" onclick="replayAnimation()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Replay
  </button>
  <label class="loop-toggle">
    <input type="checkbox" id="autoLoopCheck" onchange="toggleLoop(this)">
    Auto-Loop
  </label>
  <button class="ctrl-btn" onclick="triggerDissolve()" style="background: rgba(0, 113, 227, 0.3); border-color: rgba(0, 113, 227, 0.5);">
    Trigger Exit Dissolve
  </button>
</div>

  <!-- Apple "Get Started" Arrow Button -->
  <button class="apple-arrow-btn" id="appleArrowBtn" onclick="triggerDissolve()" title="Continue to Website">
    <svg viewBox="0 0 24 24">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
</div>

<script>
  let loopInterval = null;

  function replayAnimation() {
    const stage = document.getElementById('macStage');
    stage.classList.remove('dissolve');
    
    // Trigger DOM reflow to re-fire CSS @keyframes
    const svg = stage.querySelector('svg');
    const newSvg = svg.cloneNode(true);
    svg.parentNode.replaceChild(newSvg, svg);

    // Reset button animation
    const btn = document.getElementById('appleArrowBtn');
    btn.style.animation = 'none';
    btn.offsetHeight; /* trigger reflow */
    btn.style.animation = null;
  }

  function toggleLoop(cb) {
    if (cb.checked) {
      loopInterval = setInterval(() => {
        replayAnimation();
      }, 5500);
    } else {
      clearInterval(loopInterval);
    }
  }

  function triggerDissolve() {
    const stage = document.getElementById('macStage');
    stage.classList.add('dissolve');
    setTimeout(() => {
      alert('Dissolve completed! Website content revealed gracefully.');
    }, 1300);
  }
</script>

</body>
</html>
