<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduVision — 4 Luxury Apple-Grade Entry Animation Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
    --gold-1: #ffffff;
    --gold-2: #fff2cc;
    --gold-3: #f7d268;
    --gold-4: #c9932a;
    --gold-5: #8c6014;
  }

  body {
    background: #000000;
    color: #f5f5f7;
    font-family: 'DM Sans', -apple-system, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ══════════════════════════════════════════════════════════
     TOP OPTION SELECTOR BAR (ALWAYS FLOATING & ACCESSIBLE)
  ══════════════════════════════════════════════════════════ */
  .showcase-nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99999999;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(14, 14, 18, 0.88);
    backdrop-filter: blur(36px) saturate(200%);
    -webkit-backdrop-filter: blur(36px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(232, 180, 42, 0.2);
    padding: 8px 14px;
    border-radius: 999px;
    max-width: 96vw;
    overflow-x: auto;
  }

  .nav-opt-btn {
    background: rgba(255, 255, 255, 0.06);
    color: #a8a49c;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.25s var(--ease-apple);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .nav-opt-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    transform: translateY(-1px);
  }
  .nav-opt-btn.active {
    background: linear-gradient(135deg, #f7d268, #c9932a);
    color: #050507;
    font-weight: 700;
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: 0 4px 20px rgba(232, 180, 42, 0.5);
  }

  .nav-divider {
    width: 1px;
    height: 22px;
    background: rgba(255, 255, 255, 0.15);
    margin: 0 4px;
  }

  .action-pill {
    background: rgba(255, 255, 255, 0.1);
    color: #f7d268;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(232, 180, 42, 0.35);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .action-pill:hover {
    background: rgba(232, 180, 42, 0.2);
    color: #ffffff;
  }

  /* ══════════════════════════════════════════════════════════
     WEBSITE HOMEPAGE CANVAS (BEHIND THE INTRO OVERLAY)
  ══════════════════════════════════════════════════════════ */
  .main-website {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: #000000;
    display: flex;
    flex-direction: column;
    opacity: 1;
  }

  .navbar {
    height: 86px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6vw;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(28px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .nav-brand-img {
    height: 52px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 2px 14px rgba(232, 180, 42, 0.35));
  }

  .nav-items {
    display: flex;
    gap: 36px;
    list-style: none;
  }
  .nav-items a {
    color: #86868b;
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 500;
  }

  .nav-cta {
    background: linear-gradient(135deg, #f7d268 0%, #c9932a 100%);
    color: #000;
    font-weight: 700;
    font-size: 13.5px;
    padding: 11px 26px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }

  .hero-viewport {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 24px;
    position: relative;
    overflow: hidden;
  }

  .ambient-mesh {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 850px;
    height: 520px;
    background: radial-gradient(ellipse at center, rgba(232, 180, 42, 0.22) 0%, transparent 70%);
    filter: blur(80px);
  }

  .eyebrow-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(232, 180, 42, 0.08);
    border: 1px solid rgba(232, 180, 42, 0.28);
    color: #f7d268;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    padding: 7px 22px;
    border-radius: 999px;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .hero-h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 7vw, 92px);
    font-weight: 700;
    line-height: 1.05;
    max-width: 1020px;
    margin-bottom: 24px;
    color: #f5f5f7;
  }
  .hero-h1 em {
    font-style: italic;
    background: linear-gradient(135deg, #ffffff 0%, #fff1cc 35%, #f7d268 70%, #c9932a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-sub {
    font-size: clamp(17px, 1.9vw, 21px);
    color: #86868b;
    max-width: 680px;
    line-height: 1.6;
    margin-bottom: 42px;
  }

  .hero-btn {
    background: linear-gradient(135deg, #f7d268, #c9932a);
    color: #000;
    font-weight: 700;
    font-size: 15.5px;
    padding: 17px 38px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }

  /* ══════════════════════════════════════════════════════════
     SHARED INTRO OVERLAY HOST
  ══════════════════════════════════════════════════════════ */
  #intro-host {
    position: fixed;
    inset: 0;
    z-index: 1000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    overflow: hidden;
  }

  /* Motivational Quote Card - Luxury Apple Style */
  .luxury-quote-capsule {
    margin-top: 36px;
    max-width: 680px;
    padding: 16px 36px;
    text-align: center;
    background: rgba(18, 18, 24, 0.65);
    backdrop-filter: blur(36px) saturate(180%);
    -webkit-backdrop-filter: blur(36px) saturate(180%);
    border: 1px solid rgba(232, 180, 42, 0.28);
    border-radius: 999px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(232, 180, 42, 0.15);
  }
  .quote-pill-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: #f7d268;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .quote-pill-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 2.3vw, 24px);
    font-style: italic;
    font-weight: 600;
    color: #ffffff;
    line-height: 1.35;
  }
  .quote-pill-ceo {
    font-size: 12.5px;
    font-weight: 600;
    color: #c9932a;
    letter-spacing: 0.08em;
    margin-top: 5px;
  }

  /* ══════════════════════════════════════════════════════════
     OPTION 1: APPLE LIQUID GLASS WIPE (Caustic Frosted Reveal)
  ══════════════════════════════════════════════════════════ */
  .opt1-container {
    position: absolute;
    inset: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1.2s var(--ease-apple);
  }
  .opt1-glass-veil {
    position: absolute;
    inset: 0;
    backdrop-filter: blur(40px);
    background: radial-gradient(circle at 50% 50%, rgba(20, 20, 26, 0.75) 0%, rgba(0, 0, 0, 0.95) 100%);
    transition: opacity 1.2s var(--ease-apple), transform 1.2s var(--ease-apple);
  }
  .opt1-shimmer-beam {
    position: absolute;
    top: 50%;
    left: -20%;
    width: 140%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #e8b42a, #ffffff, #e8b42a, transparent);
    opacity: 0;
    transform: translateY(-50%) rotate(-4deg);
  }
  .opt1-content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 1.2s var(--ease-apple), opacity 1s var(--ease-apple);
  }
  .opt1-brand-h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(52px, 7vw, 84px);
    font-weight: 800;
    letter-spacing: 0.2em;
    padding-left: 0.2em;
    background: linear-gradient(135deg, #ffffff 0%, #fff2cc 30%, #f7d268 70%, #c9932a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 35px rgba(232, 180, 42, 0.55));
    opacity: 0;
    transform: scale(0.92);
    transition: all 1.2s var(--ease-apple);
  }
  .opt1-tagline {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.42em;
    color: #a8a49c;
    text-transform: uppercase;
    margin-top: 10px;
    opacity: 0;
    transition: all 1s var(--ease-apple);
  }

  /* ══════════════════════════════════════════════════════════
     OPTION 2: KEYNOTE CINEMATIC HORIZONTAL BEAM & SHUTTER SPLIT
  ══════════════════════════════════════════════════════════ */
  .opt2-container {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .opt2-shutter-top, .opt2-shutter-bottom {
    position: absolute;
    left: 0;
    right: 0;
    height: 50.5%;
    background: #050507;
    z-index: 5;
    transition: transform 1.4s var(--ease-apple);
  }
  .opt2-shutter-top { top: 0; transform-origin: top; border-bottom: 1px solid rgba(232, 180, 42, 0.25); }
  .opt2-shutter-bottom { bottom: 0; transform-origin: bottom; border-top: 1px solid rgba(232, 180, 42, 0.25); }
  
  .opt2-laser-beam {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    height: 3px;
    width: 0%;
    background: #ffffff;
    box-shadow: 0 0 25px #ffffff, 0 0 50px #f7d268, 0 0 80px #e8b42a;
    z-index: 8;
    border-radius: 2px;
    transition: width 0.9s var(--ease-apple);
  }
  .opt2-content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 1.2s var(--ease-apple), opacity 1s var(--ease-apple);
  }
  .opt2-brand {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(54px, 7.5vw, 88px);
    font-weight: 800;
    letter-spacing: 0.18em;
    padding-left: 0.18em;
    background: linear-gradient(135deg, #ffffff 0%, #fff2cc 35%, #f7d268 70%, #c9932a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 35px rgba(232, 180, 42, 0.6));
    opacity: 0;
    transform: translateY(20px);
    transition: all 1.1s var(--ease-apple);
  }

  /* ══════════════════════════════════════════════════════════
     OPTION 3: 3D CONSTELLATION ORBIT & WARP DIVE
  ══════════════════════════════════════════════════════════ */
  .opt3-container {
    position: absolute;
    inset: 0;
    background: #020204;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1.3s var(--ease-apple);
  }
  #opt3-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .opt3-content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 1.4s var(--ease-apple), opacity 1.2s var(--ease-apple);
  }
  .opt3-brand {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(52px, 7vw, 84px);
    font-weight: 800;
    letter-spacing: 0.22em;
    padding-left: 0.22em;
    background: linear-gradient(135deg, #ffffff 0%, #fff2cc 30%, #f7d268 70%, #c9932a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 35px rgba(232, 180, 42, 0.65));
    opacity: 0;
    transform: scale(0.85);
    transition: all 1.2s var(--ease-apple);
  }

  /* ══════════════════════════════════════════════════════════
     OPTION 4: ARCHITECTURAL EDITORIAL PRESTIGE (Rolex / Haute)
  ══════════════════════════════════════════════════════════ */
  .opt4-container {
    position: absolute;
    inset: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 1.3s var(--ease-apple), opacity 1.3s var(--ease-apple);
  }
  .opt4-hairline {
    position: absolute;
    top: 0;
    left: 0;
    width: 0%;
    height: 3px;
    background: linear-gradient(90deg, #c9932a, #f7d268, #ffffff);
    box-shadow: 0 0 15px #f7d268;
    transition: width 1.2s var(--ease-apple);
  }
  .opt4-content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 1.2s var(--ease-apple);
  }
  .opt4-mask-box {
    overflow: hidden;
    padding-bottom: 8px;
  }
  .opt4-brand {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(56px, 8vw, 92px);
    font-weight: 800;
    letter-spacing: 0.16em;
    background: linear-gradient(135deg, #ffffff 0%, #fff1cc 35%, #f7d268 70%, #c9932a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transform: translateY(110%);
    transition: transform 1.2s var(--ease-apple);
  }
  .opt4-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-style: italic;
    color: #e8b42a;
    letter-spacing: 0.14em;
    opacity: 0;
    transform: translateY(10px);
    transition: all 1s var(--ease-apple);
  }

</style>
</head>
<body>

<!-- ════ FLOATING OPTION SELECTOR BAR ════ -->
<div class="showcase-nav">
  <button class="nav-opt-btn active" id="btnOpt1" onclick="switchOption(1)">
    <span>✦ Option 1:</span> Liquid Glass Prism
  </button>
  <button class="nav-opt-btn" id="btnOpt2" onclick="switchOption(2)">
    <span>✦ Option 2:</span> Keynote Shutter Split
  </button>
  <button class="nav-opt-btn" id="btnOpt3" onclick="switchOption(3)">
    <span>✦ Option 3:</span> 3D Galaxy Warp
  </button>
  <button class="nav-opt-btn" id="btnOpt4" onclick="switchOption(4)">
    <span>✦ Option 4:</span> Haute Editorial
  </button>

  <div class="nav-divider"></div>

  <button class="action-pill" onclick="replayCurrentOption()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Replay
  </button>
  <button class="action-pill" id="loopToggleBtn" onclick="toggleAutoLoop()">Loop: ON</button>
</div>

<!-- ════ MAIN WEBSITE (LOGO IS ONLY IN TOP-LEFT NAVBAR CORNER!) ════ -->
<div class="main-website">
  <nav class="navbar">
    <a href="#">
      <img src="eduvision_correct_logo.png" alt="EduVision" class="nav-brand-img">
    </a>
    <ul class="nav-items">
      <li><a href="#">Courses</a></li>
      <li><a href="#">Universities</a></li>
      <li><a href="#">Mentorship</a></li>
      <li><a href="#">About</a></li>
    </ul>
    <button class="nav-cta">Book Free Session 🔑</button>
  </nav>

  <main class="hero-viewport">
    <div class="ambient-mesh"></div>
    <div class="eyebrow-tag">✦ India's Premier Education Partner</div>
    <h1 class="hero-h1">Shape Your Tomorrow With<br><em>Unrivalled Career Clarity</em></h1>
    <p class="hero-sub">1,500+ verified undergraduate & postgraduate degrees. Mentorship by CEO Miss Ishika Sharma.</p>
    <div><button class="hero-btn">Explore 1500+ Courses ✦</button></div>
  </main>
</div>

<!-- ════ INTRO OVERLAY HOST (ZERO LOGO IN INTRO!) ════ -->
<div id="intro-host"></div>

<script>
  let currentOpt = 1;
  let autoLoop = true;
  let timerA = null;
  let timerB = null;
  let timerC = null;
  let loopTimeout = null;

  function toggleAutoLoop() {
    autoLoop = !autoLoop;
    document.getElementById('loopToggleBtn').innerText = 'Loop: ' + (autoLoop ? 'ON' : 'OFF');
    if (autoLoop) replayCurrentOption();
    else clearTimeout(loopTimeout);
  }

  function clearAllTimers() {
    clearTimeout(timerA);
    clearTimeout(timerB);
    clearTimeout(timerC);
    clearTimeout(loopTimeout);
  }

  function switchOption(optNum) {
    currentOpt = optNum;
    for (let i = 1; i <= 4; i++) {
      const b = document.getElementById('btnOpt' + i);
      if (b) b.className = (i === optNum) ? 'nav-opt-btn active' : 'nav-opt-btn';
    }
    replayCurrentOption();
  }

  function replayCurrentOption() {
    clearAllTimers();
    const host = document.getElementById('intro-host');
    host.innerHTML = '';
    host.style.display = 'flex';

    if (currentOpt === 1) playOption1(host);
    else if (currentOpt === 2) playOption2(host);
    else if (currentOpt === 3) playOption3(host);
    else if (currentOpt === 4) playOption4(host);
  }

  /* ════════════════════════════════════════════════════════════
     OPTION 1: APPLE LIQUID GLASS PRISM
  ════════════════════════════════════════════════════════════ */
  function playOption1(host) {
    host.innerHTML = `
      <div class="opt1-container" id="opt1Wrap">
        <div class="opt1-glass-veil" id="opt1Veil"></div>
        <div class="opt1-content" id="opt1Box">
          <div class="opt1-brand-h1" id="opt1Brand">EDUVISION</div>
          <div class="opt1-tagline" id="opt1Tag">YOUR FUTURE STARTS HERE</div>
          <div class="luxury-quote-capsule" id="opt1Quote" style="opacity:0; transform:translateY(25px); transition: all 1s var(--ease-apple);">
            <div class="quote-pill-eyebrow">✦ Daily Inspiration ✦</div>
            <div class="quote-pill-text">"Your education is an investment that pays the best dividends. Start today!"</div>
            <div class="quote-pill-ceo">— Miss Ishika Sharma, Founder & CEO</div>
          </div>
        </div>
      </div>
    `;

    const wrap = document.getElementById('opt1Wrap');
    const brand = document.getElementById('opt1Brand');
    const tag = document.getElementById('opt1Tag');
    const box = document.getElementById('opt1Box');
    const quote = document.getElementById('opt1Quote');

    // Step 1: Text illuminates with Liquid Gold
    timerA = setTimeout(() => {
      brand.style.opacity = '1';
      brand.style.transform = 'scale(1)';
      tag.style.opacity = '1';

      // Step 2: Glides UP and Motivational Quote appears
      timerB = setTimeout(() => {
        box.style.transform = 'translateY(-40px)';
        quote.style.opacity = '1';
        quote.style.transform = 'translateY(0)';

        // Step 3: Liquid Glass dissolves, Website reveals
        timerC = setTimeout(() => {
          wrap.style.opacity = '0';
          setTimeout(() => {
            host.style.display = 'none';
            if (autoLoop) loopTimeout = setTimeout(replayCurrentOption, 3500);
          }, 1200);
        }, 2200);

      }, 1000);
    }, 150);
  }

  /* ════════════════════════════════════════════════════════════
     OPTION 2: KEYNOTE LASER BEAM & SHUTTER SPLIT
  ════════════════════════════════════════════════════════════ */
  function playOption2(host) {
    host.innerHTML = `
      <div class="opt2-container" id="opt2Wrap">
        <div class="opt2-shutter-top" id="opt2Top"></div>
        <div class="opt2-shutter-bottom" id="opt2Bot"></div>
        <div class="opt2-laser-beam" id="opt2Laser"></div>
        <div class="opt2-content" id="opt2Box">
          <div class="opt2-brand" id="opt2Brand">EDUVISION</div>
          <div class="luxury-quote-capsule" id="opt2Quote" style="opacity:0; transform:translateY(25px); transition: all 1s var(--ease-apple);">
            <div class="quote-pill-eyebrow">✦ Keynote Inspiration ✦</div>
            <div class="quote-pill-text">"Your education is an investment that pays the best dividends. Start today!"</div>
            <div class="quote-pill-ceo">— Miss Ishika Sharma, Founder & CEO</div>
          </div>
        </div>
      </div>
    `;

    const laser = document.getElementById('opt2Laser');
    const brand = document.getElementById('opt2Brand');
    const box = document.getElementById('opt2Box');
    const quote = document.getElementById('opt2Quote');
    const topS = document.getElementById('opt2Top');
    const botS = document.getElementById('opt2Bot');

    // Step 1: Laser beam expands across
    timerA = setTimeout(() => {
      laser.style.width = '80%';

      // Step 2: Laser turns into EDUVISION text
      timerB = setTimeout(() => {
        laser.style.opacity = '0';
        brand.style.opacity = '1';
        brand.style.transform = 'translateY(0)';

        // Step 3: Text glides up & Quote displays
        setTimeout(() => {
          box.style.transform = 'translateY(-45px)';
          quote.style.opacity = '1';
          quote.style.transform = 'translateY(0)';

          // Step 4: Shutter splits open vertically!
          timerC = setTimeout(() => {
            box.style.opacity = '0';
            topS.style.transform = 'translateY(-100%)';
            botS.style.transform = 'translateY(100%)';

            setTimeout(() => {
              host.style.display = 'none';
              if (autoLoop) loopTimeout = setTimeout(replayCurrentOption, 3500);
            }, 1400);
          }, 2200);

        }, 800);

      }, 600);
    }, 150);
  }

  /* ════════════════════════════════════════════════════════════
     OPTION 3: 3D CONSTELLATION ORBIT & WARP DIVE
  ════════════════════════════════════════════════════════════ */
  function playOption3(host) {
    host.innerHTML = `
      <div class="opt3-container" id="opt3Wrap">
        <canvas id="opt3-canvas"></canvas>
        <div class="opt3-content" id="opt3Box">
          <div class="opt3-brand" id="opt3Brand">EDUVISION</div>
          <div class="luxury-quote-capsule" id="opt3Quote" style="opacity:0; transform:translateY(25px); transition: all 1s var(--ease-apple);">
            <div class="quote-pill-eyebrow">✦ Daily Inspiration ✦</div>
            <div class="quote-pill-text">"Your education is an investment that pays the best dividends. Start today!"</div>
            <div class="quote-pill-ceo">— Miss Ishika Sharma, Founder & CEO</div>
          </div>
        </div>
      </div>
    `;

    const canvas = document.getElementById('opt3-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Generate gold particles
    const stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8,
        alpha: Math.random() * 0.8 + 0.2
      });
    }

    let animId;
    function renderStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(247, 210, 104, ${s.alpha})`;
        ctx.fill();
        s.x += s.vx;
        s.y += s.vy;
      });
      animId = requestAnimationFrame(renderStars);
    }
    renderStars();

    const wrap = document.getElementById('opt3Wrap');
    const brand = document.getElementById('opt3Brand');
    const box = document.getElementById('opt3Box');
    const quote = document.getElementById('opt3Quote');

    // Step 1: Text forms from constellation
    timerA = setTimeout(() => {
      brand.style.opacity = '1';
      brand.style.transform = 'scale(1)';

      // Step 2: Glides up & quote fades in
      timerB = setTimeout(() => {
        box.style.transform = 'translateY(-40px)';
        quote.style.opacity = '1';
        quote.style.transform = 'translateY(0)';

        // Step 3: Warp forward dive into the website!
        timerC = setTimeout(() => {
          cancelAnimationFrame(animId);
          box.style.transform = 'translateY(-40px) scale(1.4)';
          box.style.opacity = '0';
          wrap.style.opacity = '0';

          setTimeout(() => {
            host.style.display = 'none';
            if (autoLoop) loopTimeout = setTimeout(replayCurrentOption, 3500);
          }, 1300);
        }, 2200);

      }, 1000);
    }, 200);
  }

  /* ════════════════════════════════════════════════════════════
     OPTION 4: HAUTE EDITORIAL ARCHITECTURAL REVEAL
  ════════════════════════════════════════════════════════════ */
  function playOption4(host) {
    host.innerHTML = `

            <div class="quote-pill-eyebrow">✦ Executive Mentorship ✦</div>
            <div class="quote-pill-text">"Your education is an investment that pays the best dividends. Start today!"</div>
            <div class="quote-pill-ceo">— Miss Ishika Sharma, Founder & CEO</div>
          </div>
        </div>
      </div>
    `;

    const line = document.getElementById('opt4Line');
    const brand = document.getElementById('opt4Brand');
    const tag = document.getElementById('opt4Tag');
    const box = document.getElementById('opt4Box');
    const quote = document.getElementById('opt4Quote');
    const wrap = document.getElementById('opt4Wrap');

    // Step 1: Hairline sweeps, text rises from mask
    timerA = setTimeout(() => {
      line.style.width = '100%';
      brand.style.transform = 'translateY(0)';
      tag.style.opacity = '1';
      tag.style.transform = 'translateY(0)';

      // Step 2: Glides up & quote reveals
      timerB = setTimeout(() => {
        box.style.transform = 'translateY(-45px)';
        quote.style.opacity = '1';
        quote.style.transform = 'translateY(0)';

        // Step 3: Silk curtain lift upwards!
        timerC = setTimeout(() => {
          wrap.style.transform = 'translateY(-100%)';

          setTimeout(() => {
            host.style.display = 'none';
            if (autoLoop) loopTimeout = setTimeout(replayCurrentOption, 3500);
          }, 1300);
        }, 2200);

      }, 1100);
    }, 150);
  }

  window.onload = () => {
    switchOption(1);
  };
</script>
