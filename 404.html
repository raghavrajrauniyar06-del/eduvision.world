<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 · Under Development | EduVision 2.0</title>
  <meta name="description" content="This page is currently under development. We're working hard to bring it online soon. EduVision 2.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="animations/animations.css">
  
  <style>
    :root {
      --bg: #040508;
      --card-bg: rgba(9, 11, 20, 0.78);
      --gold: #d4af37;
      --gold-2: #f7d377;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --border-gold: rgba(212, 175, 55, 0.3);
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-Frame 3D Video Background */
    .bg-video-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-video-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.85) contrast(1.05);
    }

    /* Ambient Scrim Gradient Overlay for Text Readability */
    .bg-overlay-scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: 
        radial-gradient(ellipse at center, rgba(4, 5, 8, 0.4) 0%, rgba(4, 5, 8, 0.85) 85%),
        linear-gradient(180deg, rgba(4, 5, 8, 0.6) 0%, transparent 40%, rgba(4, 5, 8, 0.8) 100%);
    }

    /* Fixed Header Navigation Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      background: rgba(4, 5, 8, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-gold);
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), #8a6015);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.4);
    }

    .brand-logo span {
      color: var(--gold-2);
    }

    .nav-status-pill {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 8px 22px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold-2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00f2fe;
      box-shadow: 0 0 12px #00f2fe;
      animation: dotPulse 1.8s infinite;
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.65); opacity: 0.4; }
    }

    /* Main Container & Glass Overlay Card (Left Corner Aligned) */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 120px clamp(24px, 6vw, 80px) 60px;
      perspective: 1200px;
    }

    .dev-overlay-card {
      position: relative;
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      max-width: 520px;
      width: 100%;
      text-align: left;
      box-shadow: none !important;
      transform-style: preserve-3d;
      transition: transform 0.25s ease-out;
    }

    .dev-overlay-card::before {
      display: none !important;
    }

    /* Status Badge Tag */
    .badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(201, 147, 42, 0.12));
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 99px;
      padding: 8px 24px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--gold-2);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(10px);
    }

    /* Big Glowing 404 Title */
    .error-code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5.5rem, 12vw, 9.5rem);
      font-weight: 700;
      line-height: 0.85;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 0%, #fff0c4 40%, var(--gold-2) 75%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 35px rgba(212, 175, 55, 0.5));
    }

    .dev-title {
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 18px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 0, 0, 0.8);
    }

    .dev-subtitle {
      font-size: 1.12rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 480px;
      margin: 0 0 36px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.8);
    }

    /* Action Buttons (Left Aligned) */
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .btn-primary {
      padding: 16px 38px;
      border-radius: 99px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--gold), #a0741c);
      color: #ffffff;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 16px 42px rgba(212, 175, 55, 0.65);
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
    }

    .btn-secondary {
      padding: 16px 38px;
      border-radius: 99px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border-gold);
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: var(--gold);
      color: var(--gold-2);
      background: rgba(212, 175, 55, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Fixed Bottom Right Developer Credits Bar */
    .dev-credits-bar {
      position: fixed;
      bottom: 24px;
      right: 32px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(8, 10, 18, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 10px 22px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.7),
        0 0 25px rgba(212, 175, 55, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .dev-credits-bar:hover {
      border-color: var(--gold);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85), 0 0 35px rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
    }

    .dev-credits-bar strong {
      color: #ffffff;
      font-weight: 700;
    }

    .dev-divider {
      color: rgba(212, 175, 55, 0.4);
      margin: 0 4px;
    }

    .dev-email {
      color: var(--gold-2);
      text-decoration: none;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.25s;
    }

    .dev-email:hover {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
    }

    /* Responsiveness */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }

      main {
        padding: 100px 16px 40px;
      }

      .dev-overlay-card {
        padding: 40px 24px;
        border-radius: 24px;
      }

      .btn-group {
        width: 100%;
        flex-direction: column;
      }

      .btn-primary, .btn-secondary {
        width: 100%;
        justify-content: center;
      }

      .dev-credits-bar {
        bottom: 16px;
        right: 16px;
        left: 16px;
        justify-content: center;
        flex-wrap: wrap;
        padding: 8px 16px;
        font-size: 0.74rem;
      }
    }

    /* Golden Luxury Custom Cursor & Ring */
    #goldCursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 10px;
      height: 10px;
      background: #f7d377;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      box-shadow: 0 0 14px #d4af37, 0 0 25px rgba(255, 240, 196, 0.9);
      transform: translate(-50%, -50%);
    }

    #goldCursorRing {
      position: fixed;
      top: 0;
      left: 0;
      width: 38px;
      height: 38px;
      border: 1.5px solid rgba(212, 175, 55, 0.75);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      transform: translate(-50%, -50%);
      transition: width 0.25s, height 0.25s, border-color 0.25s;
    }

    #goldSparkleCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99997;
    }
  </style>
</head>
<body>

  <!-- Full-Frame 3D Video Background -->
  <div class="bg-video-container">
    <video 
      src="assets/robotvid.mp4" 
      autoplay 
      loop 
      muted 
      playsinline

  </div>

  <!-- Ambient Scrim Gradient Overlay -->
  <div class="bg-overlay-scrim"></div>

  <!-- Header Navigation -->
  <header>
    <a href="index.html" class="brand-logo">
      <div class="brand-logo-icon">📚</div>
      EduVision <span>Consultancy</span>
    </a>
    <div class="nav-status-pill">

  </header>

  <!-- Fixed Bottom Right Developer Credits Bar -->
  <div class="dev-credits-bar">
    <span class="dev-icon">💻</span>
    <span class="dev-text">Contact Developer: <strong>Raghav Raj Rauniyar</strong></span>
    <span class="dev-divider">|</span>
    <a href="mailto:raghavrajrauniyar06@gmail.com?subject=Inquiry%20via%20EduVision%20Website" 
       class="dev-email" 
       target="_blank" 
       onclick="openMailComposer(event)">
      <span>✉️</span> raghavrajrauniyar06@gmail.com
    </a>
  </div>

  <!-- Main 404 Section with Premium Glass Overlay Card -->
  <main>
    <div class="dev-overlay-card reveal-up" id="overlayCard">
      <div class="badge-tag">
        <span>⚡</span> EduVision Official · 404 Status
      </div>

      <div class="error-code">404</div>

      <h1 class="dev-title">🚧 Under Development</h1>

      <p class="dev-subtitle">
        This page is currently under development. We're working hard to bring it online soon.
      </p>

      <div class="btn-group">
        <a href="index.html" class="btn-primary apply-glow">
          <span>🏠</span> Return to Home
        </a>
        <button onclick="window.history.back()" class="btn-secondary">
          <span>↩️</span> Go Back
        </button>

  </main>

  <!-- Golden Custom Cursor & Sparkle Canvas -->
  <div id="goldCursor"></div>
  <div id="goldCursorRing"></div>
  <canvas id="goldSparkleCanvas"></canvas>

  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="animations/reveal.js"></script>

  <script>
    // Golden Mouse Cursor & Sparkle Particle Trail Engine
    const goldCursor = document.getElementById('goldCursor');
    const goldCursorRing = document.getElementById('goldCursorRing');
    const sparkleCanvas = document.getElementById('goldSparkleCanvas');

    if (goldCursor && goldCursorRing && sparkleCanvas) {
      const ctx = sparkleCanvas.getContext('2d');
      let width = (sparkleCanvas.width = window.innerWidth);
      let height = (sparkleCanvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = sparkleCanvas.width = window.innerWidth;
        height = sparkleCanvas.height = window.innerHeight;
      });

      let mouseX = width / 2;
      let mouseY = height / 2;
      let ringX = width / 2;
      let ringY = height / 2;

      const particles = [];
      const colors = ['#ffffff', '#fff0c4', '#f7d377', '#d4af37', '#e8b42a'];

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        goldCursor.style.left = `${mouseX}px`;
        goldCursor.style.top = `${mouseY}px`;

        // Spawn golden stardust particles on move
        for (let i = 0; i < 2; i++) {
          particles.push({
            x: mouseX + (Math.random() - 0.5) * 8,
            y: mouseY + (Math.random() - 0.5) * 8,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5 - 0.4,
            size: Math.random() * 3.5 + 1.5,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            life: Math.random() * 0.03 + 0.015
          });
        }
      });

      // Golden Sparkle burst on click
      document.addEventListener('click', (e) => {
        for (let i = 0; i < 24; i++) {
          const angle = (Math.PI * 2 / 24) * i;
          const speed = Math.random() * 4 + 2;
          particles.push({
            x: e.clientX,
            y: e.clientY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 4 + 2,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            life: Math.random() * 0.02 + 0.015
          });
        }
      });

      function renderSparkles() {
        ctx.clearRect(0, 0, width, height);

        // Smooth ring lerp following cursor
        ringX += (mouseX - ringX) * 0.18;
        ringY += (mouseY - ringY) * 0.18;
        goldCursorRing.style.left = `${ringX}px`;
        goldCursorRing.style.top = `${ringY}px`;

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.life;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 12;
          ctx.shadowColor = p.color;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(renderSparkles);
      }

      renderSparkles();
    }

    // Smart Mail Composer Dispatcher (Opens Gmail Web Compose & Native Mail Client)
    function openMailComposer(e) {
      if (e) e.preventDefault();
      const email = 'raghavrajrauniyar06@gmail.com';
      const subject = encodeURIComponent('Inquiry via EduVision Website');
      const body = encodeURIComponent('Hello Raghav,\n\nI am contacting you regarding...');
      
      const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${subject}&body=${body}`;
      const win = window.open(gmailUrl, '_blank');
      
      if (!win || win.closed || typeof win.closed === 'undefined') {
        window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
      }
    }

    // 3D Parallax Mouse Tracking for Overlay Card
    const card = document.getElementById('overlayCard');

    if (card) {
      document.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.clientX) / 30;
        const yAxis = (window.innerHeight / 2 - e.clientY) / 30;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      });

      // Mobile Touch Drag 3D Tilt
      document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const xAxis = (window.innerWidth / 2 - e.touches[0].clientX) / 20;
          const yAxis = (window.innerHeight / 2 - e.touches[0].clientY) / 20;
          card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        }
      });
    }

    // Video Autoplay Fallback
    const bgVideo = document.getElementById('bgVideo');
    if (bgVideo) {
      bgVideo.play().catch(err => {
        console.log("Autoplay fallback active");
      });
    }
  </script>
